apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config
  template:
    metadata:
      labels:
        app: config
    spec:
      containers:
        - name: config
          image: alexandre/config-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8761

---
apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  type: LoadBalancer
  selector:
    app: config
  ports:
    - port: 8888
      targetPort: 8888
