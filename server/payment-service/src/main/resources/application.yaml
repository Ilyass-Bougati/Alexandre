spring:
  application:
    name: payment-service

  profiles:
    active: ${ACTIVE_PROFILE:dev}

  config:
    import: "optional:configserver:"

  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        max-attempts: 20

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

stripe:
  secret-key: ${STRIPE_API_KEY}
  success-url: http://localhost:8085/payment/api/v1/success/
  cancel-url: http://localhost:8085/payment/api/v1/cancel/