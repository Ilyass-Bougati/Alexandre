spring:
  application:
    name: user-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alexandre_user_service}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/Alexandre
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

jwt-converter:
  resource-id: public-client
  principle-attribute: preferred_username

otel:
  metrics:
    exporter: none
  logs:
    exporter: none
  traces:
    exporter: none

server:
  port: 0

keycloak:
  url: http://localhost:8080/
  admin-username: ${KC_ADMIN_USERNAME:alex}
  admin-password: ${KC_ADMIN_PASSWORD:AlexAdmin}
  realm: Alexandre
  client-id: public-client
  client-secret: aa
